[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "image-classification-dino"
version = "0.1.0"
description = "Local DINOv3 image embedding and clustering pipeline"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "pillow>=10.0",
  "pyyaml>=6.0",
  "scikit-learn>=1.3",
  "torch>=2.1",
  "tqdm>=4.66",
  "transformers>=4.56",
]

[project.scripts]
dino-images = "image_classification_dino.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
